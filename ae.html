<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback - Aula Experimental</title>
    <link
      rel="icon"
      href="https://ctrlplay.com.br/wp-content/uploads/2021/05/cropped-favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="https://ctrlplay.com.br/wp-content/uploads/2021/05/cropped-favicon-192x192.png"
      sizes="192x192"
    />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.38/daisyui.css" rel="stylesheet" type="text/css" />
    <link href="css/site.css" rel="stylesheet" />
    <script src="js/ae.js" type="module" defer></script>
  </head>
  <body>
    <main class="page-shell">
    <header class="page-header">
      <h1>Aula Experimental ✨🚀</h1>
        <nav class="page-nav">
          <a class="link" href="index.html">Voltar</a>

          <a class="link" href="whatsapp.html">AE Whatsapp</a>
        </nav>
    </header>

    <form>
      <div class="form-section fields fields-experimental">


        <div class="field">
          <label for="aluno" class="field-label">Aluno</label>
          <input
            type="text"
            name="aluno"
            id="aluno"
            class="input"
            placeholder="Nome completo do aluno"
          />
        </div>

        <div class="field">
          <label for="professor" class="field-label">Professor</label>
          <select name="professor" id="professor" class="select">
            <option selected>---</option>
          </select>
        </div>

        <div class="field field-third">
          <label class="field-label" for="nivel">Nível recomendado</label>
          <input
            type="text"
            name="nivel"
            id="nivel"
            class="input"
            placeholder="Ex: CK1, CK2, CT1, CT2..."
          />
        </div>

        <div class="field field-third">
          <label for="projeto" class="field-label">Projeto aplicado</label>
          <input
            type="text"
            name="projeto"
            id="projeto"
            class="input"
            placeholder="Ex: DOOM Construct"
          />
        </div>

        <div class="field field-third">
          <label for="code" class="field-label">Nível Code</label>
          <select name="code" id="code" class="select">
            <option selected>N/A</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
          </select>
        </div>

        <div class="field field-wide">
          <label for="desenvolvimento" class="field-label"
            >Desenvolvimento do aluno</label
          >
          <textarea
            class="textarea"
            id="desenvolvimento"
            name="desenvolvimento"
            rows="3"
            placeholder="- Como o aluno reagiu ao conteúdo?&#10;- Quais dificuldades ou facilidades apresentou?&#10;- Algo específico chamou atenção?"
          ></textarea>
        </div>

        <div class="field field-wide">
          <label for="adicionais" class="field-label"
            >Observações adicionais</label
          >
          <textarea
            class="textarea"
            id="adicionais"
            name="adicionais"
            rows="3"
            placeholder="Registre informações extras sobre o aluno, recomendações ou percepções relevantes"
          ></textarea>
        </div>

        <div class="field field-wide">
          <span class="field-label">Tem condições de frequentar o curso?</span>
          <div class="choice">
            <input
              type="radio"
              name="condicoes"
              id="Sim"
              value="Sim"
              class="radio radio-sm"
              checked
            />
            <label for="Sim">Sim</label>
          </div>

          <div class="choice">
            <input
              type="radio"
              name="condicoes"
              id="Não"
              value="Não"
              class="radio radio-sm"
            />
            <label for="Não"
              >Não
              <span class="text-muted"
                >(explique no campo acima)</span
              ></label
            >
          </div>
        </div>

      </div>
      <div class="actions">
        <button class="btn btn-ghost" type="reset">Limpar campos</button>
        <button class="btn btn-primary" id="gerar-texto" type="submit">Gerar texto</button>
      </div>
    </form>
    </main>
    <div
      class="alert alert-success copy-notice"
      role="alert"
    >
      Texto copiado para a área de transferência!
    </div>
  </body>
</html>
