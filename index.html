<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback - Ctrl+Play</title>
    <link
      rel="icon"
      href="https://ctrlplay.com.br/wp-content/uploads/2021/05/cropped-favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="https://ctrlplay.com.br/wp-content/uploads/2021/05/cropped-favicon-192x192.png"
      sizes="192x192"
    />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.38/daisyui.css" rel="stylesheet" type="text/css" />
    <script src="js/main.js" type="module" defer></script>
    <link href="css/site.css" rel="stylesheet" />
  </head>
  <body>
    <main class="page-shell">
    <header class="page-header">
      <div>
        <h1>Feedback ✨🚀</h1>
      </div>
      <a class="link" href="ae.html">Aula experimental</a>
    </header>

    <form>
      <div class="form-section">
        <div class="fields">
        <div class="field">
          <label class="field-label" for="tema">Tema da aula</label>
          <input type="text" name="tema" id="tema" class="input" />
        </div>

        <div class="field">
          <label class="field-label" for="ferramenta">Ferramenta</label>
          <select class="select" id="ferramenta" name="ferramenta">
            <option selected>---</option>
          </select>
        </div>

        <div class="field field-wide">
          <div class="summary-heading">
            <label class="field-label" for="aula">Resumo sobre a aula</label>
            <button type="button" id="gerar-resumo" class="btn btn-soft" aria-controls="aula" aria-describedby="resumo-ajuda">✨ Gerar resumo</button>
          </div>
          <div class="summary-editor">
          <textarea
            class="textarea"
            id="aula"
            name="aula"
            aria-describedby="resumo-ajuda resumo-status"
            rows="2"
            placeholder="Descreva sua aula em um parágrafo simples"
          ></textarea>
          <div class="summary-shimmer" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          </div>
          <div id="resumo-ajuda" class="field-help">A IA usa o tema e a ferramenta para sugerir 200–300 caracteres. Ao gerar novamente, o resumo será substituído.</div>
          <div id="resumo-status"  role="status" aria-live="polite"></div>
        </div>

        </div>
      </div>
      <div class="form-section extras">
        <div class="fields">
        <div class="field field-wide">
          <label class="field-label" for="desafio">Desafio</label>
          <textarea
            class="textarea"
            id="desafio"
            name="desafio"
            rows="2"
            placeholder="Qual o desafio para a próxima aula?"
          ></textarea>
        </div>

        <div class="field field-wide">
          <div class="portal-option">
            <input type="checkbox" class="checkbox checkbox-sm" name="desafio-portal" id="desafio-portal" />
            <label for="desafio-portal">Utilizar desafio pelo portal</label>
          </div>
        </div>

        <div class="field field-wide">
          <label class="field-label" for="recomendada"
            >Prática Recomendada</label
          >
          <textarea
            class="textarea"
            id="recomendada"
            name="recomendada"
            rows="2"
            placeholder="Tem alguma atividade para recomendar aos alunos?"
          ></textarea>
        </div>

        </div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" type="reset">Limpar campos</button>
        <button class="btn btn-primary" id="gerar-texto" type="button">Gerar texto</button>
      </div>
    </form>
    </main>
    <div
      class="alert alert-success copy-notice"
      role="alert"
    >
      Texto copiado para a área de transferência!
    </div>
  </body>
</html>
