<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback - AE Whatsapp</title>
    <link
      rel="icon"
      href="https://ctrlplay.com.br/wp-content/uploads/2021/05/cropped-favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="https://ctrlplay.com.br/wp-content/uploads/2021/05/cropped-favicon-192x192.png"
      sizes="192x192"
    />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.38/daisyui.css" rel="stylesheet" type="text/css" />
    <link href="css/site.css" rel="stylesheet" />
    <script src="js/whatsapp.js" type="module" defer></script>
  </head>
  <body>
    <main class="page-shell">
    <header class="page-header">
      <h1>AE Whatsapp ✨🚀</h1>
        <nav class="page-nav">
          <a class="link" href="index.html">Voltar</a>

          <a class="link" href="ae.html">Aula Experimental</a>
        </nav>
    </header>

    <form>
      <div class="form-section fields">


        <div class="field field-wide">
          <label for="aluno" class="field-label">Aluno</label>
          <input
            type="text"
            name="aluno"
            id="aluno"
            class="input"
            placeholder="Primeiro nome ou nome composto"
          />
        </div>

        <div class="field">
          <label for="publicado" class="field-label">Link do Projeto <span class="text-muted">Itch.io</span></label>
          <input
            type="text"
            name="publicado"
            id="publicado"
            class="input"
            placeholder="Link do projeto publicado"
          />
        </div>

        <div class="field">
          <label for="arquivo" class="field-label">Arquivo <span class="text-muted">Google Drive</span></label>
          <input
            type="text"
            name="arquivo"
            id="arquivo"
            class="input"
            placeholder="Link do arquivo editável"
          />
        </div>

      </div>
      <div class="actions">
        <button class="btn btn-ghost" type="reset">Limpar campos</button>
        <button class="btn btn-primary" id="gerar-texto" type="submit">Gerar texto</button>
      </div>
    </form>
    </main>
    <div
      class="alert alert-success copy-notice"
      role="alert"
    >
      Texto copiado para a área de transferência!
    </div>
  </body>
</html>
